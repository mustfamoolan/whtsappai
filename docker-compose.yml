

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_KEY=production-secret-key-1234
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - DB_DATABASE=whtsapai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHATSAPP_SESSION_PATH=./data/whatsapp_session
    volumes:
      - ./data/app:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whtsappai.rule=Host(`ai.almoq3.com`)"
      - "traefik.http.routers.whtsappai.entrypoints=web,websecure"
      - "traefik.http.routers.whtsappai.tls.certresolver=letsencrypt"
      - "traefik.http.services.whtsappai.loadbalancer.server.port=8080"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=whtsapai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
